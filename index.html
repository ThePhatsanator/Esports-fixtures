<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Fixtures</title>


    <link rel="stylesheet" href="css/style.css">


    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


    <script src="js/Test1.js" defer></script>


<link rel="icon" href="images/logo.png" type="image/png">
</head>


<body>
<div id="navbar-container"></div>

<script>
    // Load the navbar dynamically
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
        });
</script>

<h2>Login</h2>
<input type="email" id="email" placeholder="Email" />
<input type="password" id="password" placeholder="Password" />
<button onclick="login()">Login</button>
<p>Don't have an account? <a href="/Esports-fixtures/registration.html">Register</a></p>

<script>
    function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        auth.signInWithEmailAndPassword(email, password)
            .then(() => window.location.href = "dashboard.html")
            .catch(error => alert(error.message));
    }
</script>
<script>
    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
    }
</script>

<div id="banner-container"></div>

<script>
    fetch("banner.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("banner-container").innerHTML = data;
        });
</script>

<script>
    // Load footer HTML first
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML("beforeend", data);

            // After footer loads, fetch live updates from Firestore
            db.collection("updates")
                .orderBy("timestamp", "desc")
                .limit(5)
                .onSnapshot(snapshot => {
                    const messages = snapshot.docs.map(doc => doc.data().message);
                    const marquee = document.getElementById("updates-marquee");
                    marquee.textContent = messages.join("  ⚔️  ");
                });
        });
</script>



</body>
</html>
