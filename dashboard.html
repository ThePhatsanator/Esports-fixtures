<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Sports Fixtures | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<script>
    fetch("navbar.html")
        .then(res => res.text())
        .then(html => document.getElementById("navbar-container").innerHTML = html)
        .catch(err => console.error("Navbar load failed:", err));
</script>

<div class="container" style="text-align: right; margin-top:10px;">
    <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<main class="container">
    <h2>Welcome to the Dashboard</h2>
    <p>Use the navigation above to manage teams, players, fixtures, and view results.</p>
    <button id="logoutBtn">Logout</button>
</main>

<div id="banner-container"></div>
<script>
    fetch("banner.html")
        .then(res => res.text())
        .then(html => document.getElementById("banner-container").innerHTML = html)
        .catch(err => console.error("Banner load failed:", err));
</script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase-loader.js"></script>

<script src="theme-toggle.js"></script>

<!-- fallback waiter -->
<script>
    if (!window.firebaseReady) {
        console.warn("⚠️ firebase-init.js not loaded yet — waiting for Firebase to initialize...");
        window.firebaseReady = new Promise((resolve) => {
            const checkInterval = setInterval(() => {
                if (window.firebase && firebase.apps && firebase.apps.length > 0 && firebase.auth) {
                    clearInterval(checkInterval);
                    window.db = window.db || firebase.firestore();
                    window.auth = window.auth || firebase.auth();
                    console.log("✅ Firebase fallback initialization complete (dashboard)");
                    resolve();
                }
            }, 100);
        });
    }
</script>

<script>
    window.firebaseReady.then(() => {
        console.log("🔥 Firebase ready — dashboard page");

        function logout() {
            auth.signOut()
                .then(() => window.location.href = "index.html")
                .catch(err => alert("Logout failed: " + err.message));
        }
        window.logout = logout;

        document.getElementById("logoutBtn").addEventListener("click", logout);

        // Redirect if not logged in
        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = "index.html";
        });
    });
</script>

<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);
            window.firebaseReady.then(() => {
                db.collection("updates").orderBy("timestamp", "desc").limit(5)
                    .onSnapshot(snapshot => {
                        const messages = snapshot.docs.map(d => d.data().message);
                        const marquee = document.getElementById("updates-marquee");
                        if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                    });
            });
        })
        .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
