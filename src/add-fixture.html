<!DOCTYPE html>
<html>
<link rel="stylesheet" href="style.css">

<head>
  <title>Add Fixture</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="Test1.js"></script>

</head>
<body>

<div id="navbar-container"></div>

<script>
  // Load the navbar dynamically
  fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
          });
</script>

<h2>Add Fixture</h2>

<label for="teamA">Select Team A:</label>
<select id="teamA"></select><br><br>

<label for="teamB">Select Team B:</label>
<select id="teamB"></select><br><br>

<label for="matchDate">Match Date:</label>
<input type="date" id="matchDate"><br><br>

<button onclick="addFixture()">Add Fixture</button>

<p id="statusMessage"></p>

<script>
  // Load teams into dropdowns
  db.collection("teams").get().then((querySnapshot) => {
    const teamASelect = document.getElementById("teamA");
    const teamBSelect = document.getElementById("teamB");
    querySnapshot.forEach((doc) => {
      const team = doc.data().teamName;
      const id = doc.id;

      const optionA = document.createElement("option");
      optionA.value = team;
      optionA.text = team;
      teamASelect.appendChild(optionA);

      const optionB = document.createElement("option");
      optionB.value = team;
      optionB.text = team;
      teamBSelect.appendChild(optionB);
    });
  });

  function addFixture() {
    const teamA = document.getElementById("teamA").value;
    const teamB = document.getElementById("teamB").value;
    const matchDate = document.getElementById("matchDate").value;

    if (teamA === teamB) {
      alert("❌ Teams must be different.");
      return;
    }

    db.collection("fixtures").add({
      teamA: teamA,
      teamB: teamB,
      date: matchDate,
      result: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    })
            .then(() => {
              document.getElementById("statusMessage").innerText = "✅ Fixture added successfully!";
            })
            .catch((error) => {
              document.getElementById("statusMessage").innerText = "❌ Error: " + error.message;
              console.error(error);
            });
  }

</script>
<script>
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
  }
</script>

<div id="banner-container"></div>

<script>
  fetch("banner.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("banner-container").innerHTML = data;
          });
</script>

</body>
</html>
