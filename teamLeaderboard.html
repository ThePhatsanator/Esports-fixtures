<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Fixtures | Page Title</title>

  <!-- 🔗 CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 🔥 Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- ⚙️ Firebase Config + Theme Script -->
  <script src="js/Test1.js" defer></script>
  <script src="js/firebase-loader.js" defer></script>


</head>

<body>
<!-- ===== NAVBAR ===== -->
<div id="navbar-container"></div>
<script>
  fetch("navbar.html")
          .then(res => res.text())
          .then(html => document.getElementById("navbar-container").innerHTML = html)
          .catch(err => console.error("Navbar load failed:", err));
</script>

<!-- ===== THEME TOGGLE BUTTON ===== -->
<div class="container" style="text-align: right; margin-top: 10px;">
  <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<!-- ===== MAIN CONTENT AREA ===== -->

<h2>Team Leaderboard (By Wins)</h2>

<table border="1" cellpadding="10">
  <thead>
  <tr>
    <th>Rank</th>
    <th>Team Name</th>
    <th>Wins</th>
  </tr>
  </thead>
  <tbody id="leaderboardBody">
  <tr><td colspan="3">Loading...</td></tr>
  </tbody>
</table>

<script>
  const leaderboardBody = document.getElementById("leaderboardBody");

  // Step 1: Get all fixtures with results
  db.collection("fixtures").where("result", "!=", "").get()
          .then((querySnapshot) => {
            const winCounts = {};

            querySnapshot.forEach((doc) => {
              const data = doc.data();
              const winner = data.result;

              if (winner) {
                if (!winCounts[winner]) {
                  winCounts[winner] = 1;
                } else {
                  winCounts[winner]++;
                }
              }
            });

            // Step 2: Convert to array and sort
            const sortedTeams = Object.entries(winCounts)
                    .map(([team, wins]) => ({ team, wins }))
                    .sort((a, b) => b.wins - a.wins);

            // Step 3: Display leaderboard
            leaderboardBody.innerHTML = "";

            sortedTeams.forEach((entry, index) => {
              const row = document.createElement("tr");
              row.innerHTML = `
            <td>${index + 1}</td>
            <td>${entry.team}</td>
            <td>${entry.wins}</td>
          `;
              leaderboardBody.appendChild(row);
            });

            if (sortedTeams.length === 0) {
              leaderboardBody.innerHTML = "<tr><td colspan='3'>No results available yet.</td></tr>";
            }
          })
          .catch((error) => {
            console.error("Error loading leaderboard:", error);
            leaderboardBody.innerHTML = "<tr><td colspan='3'>Error loading leaderboard.</td></tr>";
          });
</script>

<!-- ===== BANNER ===== -->
<div id="banner-container"></div>
<script>
  fetch("banner.html")
          .then(res => res.text())
          .then(html => document.getElementById("banner-container").innerHTML = html)
          .catch(err => console.error("Banner load failed:", err));
</script>

<!-- ===== FOOTER + LIVE UPDATES ===== -->
<script>
  fetch("footer.html")
          .then(res => res.text())
          .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);

            // Fetch latest updates for the news banner
            db.collection("updates")
                    .orderBy("timestamp", "desc")
                    .limit(5)
                    .onSnapshot(snapshot => {
                      const messages = snapshot.docs.map(doc => doc.data().message);
                      const marquee = document.getElementById("updates-marquee");
                      if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                    });
          })
          .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
