<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>E-Sports Fixtures | View Players</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<script>fetch("navbar.html").then(r=>r.text()).then(h=>document.getElementById("navbar-container").innerHTML=h);</script>

<div class="container" style="text-align:right; margin-top:10px;"><button id="theme-toggle">🌙 Toggle Dark/Light</button></div>

<main class="container">
  <h2>View Players by Team</h2>

  <label for="teamSelect">Select Team:</label>
  <select id="teamSelect"><option disabled selected>Loading teams...</option></select>
  <button id="loadPlayersBtn">Load Players</button>

  <h3>Players:</h3>
  <ul id="playerList"></ul>
</main>

<div id="banner-container"></div>
<script>fetch("banner.html").then(r=>r.text()).then(html=>document.getElementById("banner-container").innerHTML=html);</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase-loader.js"></script>

<!-- fallback waiter -->
<script>
  if (!window.firebaseReady) {
    console.warn("⚠️ firebase-init.js not loaded yet — waiting for Firebase to initialize...");
    window.firebaseReady = new Promise((resolve) => {
      const checkInterval = setInterval(() => {
        if (window.firebase && firebase.apps && firebase.apps.length > 0 && firebase.auth) {
          clearInterval(checkInterval);
          window.db = window.db || firebase.firestore();
          window.auth = window.auth || firebase.auth();
          console.log("✅ Firebase fallback initialization complete (view-players)");
          resolve();
        }
      }, 100);
    });
  }
</script>

<script>
  window.firebaseReady.then(()=>{
    const teamSelect = document.getElementById("teamSelect");
    const playerList = document.getElementById("playerList");

    db.collection("teams").get().then(snapshot=>{
      teamSelect.innerHTML = '<option disabled selected>Select a team</option>';
      if (snapshot.empty) {
        teamSelect.innerHTML = '<option disabled>No teams</option>';
        return;
      }
      snapshot.forEach(doc=>{
        const opt = document.createElement("option");
        opt.value = doc.id;
        opt.text = doc.data().teamName || doc.data().name || "Unnamed";
        teamSelect.appendChild(opt);
      });
    });

    document.getElementById("loadPlayersBtn").addEventListener("click", ()=>{
      const teamId = teamSelect.value;
      if (!teamId) return alert("Please select a team");
      playerList.innerHTML = "Loading...";
      db.collection("players").where("teamId","==",teamId).get()
              .then(snapshot=>{
                playerList.innerHTML = "";
                if (snapshot.empty) {
                  playerList.innerHTML = "<li>No players found.</li>";
                  return;
                }
                snapshot.forEach(doc=>{
                  const p = doc.data();
                  const li = document.createElement("li");
                  li.textContent = `${p.playerName} (${p.gamerTag}) - Role: ${p.role || "N/A"}`;
                  playerList.appendChild(li);
                });
              })
              .catch(err=>{
                console.error("Error loading players:", err);
                playerList.innerHTML = "<li>Error loading players.</li>";
              });
    });
  });
</script>

<!-- footer -->
<script>
  fetch("footer.html").then(r=>r.text()).then(html=>{
    document.body.insertAdjacentHTML("beforeend", html);
    window.firebaseReady.then(()=> {
      db.collection("updates").orderBy("timestamp","desc").limit(5).onSnapshot(snap=>{
        const messages = snap.docs.map(d=>d.data().message);
        const marquee = document.getElementById("updates-marquee");
        if (marquee) marquee.textContent = messages.join(" ⚔️ ");
      });
    });
  });
</script>
</body>
</html>
