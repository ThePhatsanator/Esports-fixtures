<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Fixtures</title>


  <base href="/Esports-fixtures/">


  <link rel="stylesheet" href="css/style.css">


  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


  <script src="js/Test1.js"></script>
</head>


<body>
<div id="navbar-container"></div>

<script>
  // Load the navbar dynamically
  fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
          });
</script>

<h2>Register</h2>
<input type="email" id="email" placeholder="Email" />
<input type="password" id="password" placeholder="Password" />
<select id="role">
  <option value="teamManager">Team Manager</option>
  <option value="organizer">Tournament Organizer</option>
</select>
<button onclick="register()">Register</button>

<script>
  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    auth.createUserWithEmailAndPassword(email, password)
            .then((cred) => {
              console.log("✅ Auth complete:", cred.user.uid);
              return db.collection("users").doc(cred.user.uid).set({
                email: email,
                role: role,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            })
            .then(() => {
              console.log("✅ Firestore write complete.");
              // Delay before redirect to allow alert to show
              alert("✅ Registration successful!");
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 100); // small delay so alert can be seen
            })
            .catch((error) => {
              console.error("❌ Registration error:", error);
              alert("❌ Error: " + error.message);
            });
  }
</script>
<script>
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
  }
</script>


<script>
  // Load footer HTML first
  fetch("footer.html")
          .then(response => response.text())
          .then(data => {
            document.body.insertAdjacentHTML("beforeend", data);

            // After footer loads, fetch live updates from Firestore
            db.collection("updates")
                    .orderBy("timestamp", "desc")
                    .limit(5)
                    .onSnapshot(snapshot => {
                      const messages = snapshot.docs.map(doc => doc.data().message);
                      const marquee = document.getElementById("updates-marquee");
                      marquee.textContent = messages.join("  ⚔️  ");
                    });
          });
</script>


</body>
</html>
