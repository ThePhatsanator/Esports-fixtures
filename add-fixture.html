<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Sports Fixtures | Add Fixture</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- loader first, then Test1 -->
  <script src="js/firebase-loader.js" defer></script>
  <script src="js/Test1.js" defer></script>
</head>
<body>
<div id="navbar-container"></div>
<script>
  fetch("navbar.html")
          .then(res => res.text())
          .then(html => document.getElementById("navbar-container").innerHTML = html)
          .catch(err => console.error("Navbar load failed:", err));
</script>

<div class="container" style="text-align: right; margin-top: 10px;">
  <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<main class="container">
  <h2>Add Fixture</h2>

  <label for="teamA">Select Team A:</label>
  <select id="teamA"></select><br><br>

  <label for="teamB">Select Team B:</label>
  <select id="teamB"></select><br><br>

  <label for="matchDate">Match Date:</label>
  <input type="date" id="matchDate"><br><br>

  <button id="addFixtureBtn">Add Fixture</button>
  <p id="statusMessage"></p>
</main>

<script>
  window.firebaseReady.then(() => {
    const teamASelect = document.getElementById("teamA");
    const teamBSelect = document.getElementById("teamB");
    const statusMsg = document.getElementById("statusMessage");

    // Load teams into dropdowns
    db.collection("teams").get()
            .then((querySnapshot) => {
              teamASelect.innerHTML = "<option disabled selected>Select Team A</option>";
              teamBSelect.innerHTML = "<option disabled selected>Select Team B</option>";
              if (querySnapshot.empty) {
                teamASelect.innerHTML = "<option disabled>No teams found</option>";
                teamBSelect.innerHTML = "<option disabled>No teams found</option>";
                return;
              }
              querySnapshot.forEach((doc) => {
                const team = doc.data().teamName || doc.data().name || "(Unnamed)";
                const optionA = document.createElement("option");
                optionA.value = team;
                optionA.text = team;
                teamASelect.appendChild(optionA);

                const optionB = document.createElement("option");
                optionB.value = team;
                optionB.text = team;
                teamBSelect.appendChild(optionB);
              });
            })
            .catch(err => {
              console.error("Error loading teams:", err);
              statusMsg.textContent = "Error loading teams.";
            });

    // Add fixture handler
    document.getElementById("addFixtureBtn").addEventListener("click", () => {
      const teamA = teamASelect.value;
      const teamB = teamBSelect.value;
      const matchDate = document.getElementById("matchDate").value;

      if (!teamA || !teamB || !matchDate) {
        statusMsg.textContent = "⚠️ Please fill in all fields.";
        return;
      }
      if (teamA === teamB) {
        alert("❌ Teams must be different.");
        return;
      }

      db.collection("fixtures").add({
        teamA: teamA,
        teamB: teamB,
        date: matchDate,
        result: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      })
              .then(() => {
                statusMsg.textContent = "✅ Fixture added successfully!";
              })
              .catch((error) => {
                statusMsg.textContent = "❌ Error: " + error.message;
                console.error(error);
              });
    });
  });
</script>

<div id="banner-container"></div>
<script>
  fetch("banner.html")
          .then(res => res.text())
          .then(html => document.getElementById("banner-container").innerHTML = html)
          .catch(err => console.error("Banner load failed:", err));
</script>

<script>
  fetch("footer.html")
          .then(res => res.text())
          .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);
            window.firebaseReady.then(() => {
              db.collection("updates").orderBy("timestamp", "desc").limit(5)
                      .onSnapshot(snapshot => {
                        const messages = snapshot.docs.map(d => d.data().message);
                        const marquee = document.getElementById("updates-marquee");
                        if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                      });
            });
          })
          .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
