<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Fixtures | Page Title</title>

  <!-- 🔗 CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 🔥 Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- ⚙️ Firebase Config + Theme Script -->

  <script src="js/Test1.js" defer></script>
  <script src="js/firebase-loader.js" defer></script>

  <script src="theme-toggle.js"></script>


</head>

<body>
<!-- ===== NAVBAR ===== -->
<div id="navbar-container"></div>
<script>
  fetch("navbar.html")
          .then(res => res.text())
          .then(html => document.getElementById("navbar-container").innerHTML = html)
          .catch(err => console.error("Navbar load failed:", err));
</script>

<!-- ===== THEME TOGGLE BUTTON ===== -->
<div class="container" style="text-align: right; margin-top: 10px;">
  <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<!-- ===== MAIN CONTENT AREA ===== -->

<h2>Register</h2>
<input type="email" id="email" placeholder="Email" />
<input type="password" id="password" placeholder="Password" />
<select id="role">
  <option value="teamManager">Team Manager</option>
  <option value="organizer">Tournament Organizer</option>
</select>
<button onclick="register()">Register</button>

<script>
  function register() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    auth.createUserWithEmailAndPassword(email, password)
            .then((cred) => {
              console.log("✅ Auth complete:", cred.user.uid);
              return db.collection("users").doc(cred.user.uid).set({
                email: email,
                role: role,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            })
            .then(() => {
              console.log("✅ Firestore write complete.");
              // Delay before redirect to allow alert to show
              alert("✅ Registration successful!");
              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 100); // small delay so alert can be seen
            })
            .catch((error) => {
              console.error("❌ Registration error:", error);
              alert("❌ Error: " + error.message);
            });
  }
</script>

<!-- ===== BANNER ===== -->
<div id="banner-container"></div>
<script>
  fetch("banner.html")
          .then(res => res.text())
          .then(html => document.getElementById("banner-container").innerHTML = html)
          .catch(err => console.error("Banner load failed:", err));
</script>

<!-- ===== FOOTER + LIVE UPDATES ===== -->
<script>
  fetch("footer.html")
          .then(res => res.text())
          .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);

            // Fetch latest updates for the news banner
            db.collection("updates")
                    .orderBy("timestamp", "desc")
                    .limit(5)
                    .onSnapshot(snapshot => {
                      const messages = snapshot.docs.map(doc => doc.data().message);
                      const marquee = document.getElementById("updates-marquee");
                      if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                    });
          })
          .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
