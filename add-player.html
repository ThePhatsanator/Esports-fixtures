<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Fixtures</title>


    <link rel="stylesheet" href="css/style.css">


    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


    <script src="js/Test1.js" defer></script>

   <link rel="icon" href="images/logo.png" type="image/png">
</head>


<body>
<div id="navbar-container"></div>

<script>
    // Load the navbar dynamically
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
        });
</script>

<h2>Add Player</h2>

<input type="text" id="playerName" placeholder="Full Name" /><br />
<input type="text" id="gamerTag" placeholder="Gamer Tag" /><br />
<input type="text" id="role" placeholder="Role (e.g. Captain, Sniper)" /><br />

<label for="teamSelect">Select Team:</label>
<select id="teamSelect">
    <option disabled selected>Loading teams...</option>
</select><br />

<button onclick="addPlayer()">Add Player</button>

<script>
    // Load teams from Firestore
    db.collection("teams").get().then((querySnapshot) => {
        const teamSelect = document.getElementById("teamSelect");
        teamSelect.innerHTML = "";
        querySnapshot.forEach((doc) => {
            const option = document.createElement("option");
            option.value = doc.id;
            option.text = doc.data().teamName;
            teamSelect.appendChild(option);
        });
    });

    function addPlayer() {
        const playerName = document.getElementById("playerName").value;
        const gamerTag = document.getElementById("gamerTag").value;
        const role = document.getElementById("role").value;
        const teamId = document.getElementById("teamSelect").value;

        db.collection("players").add({
            playerName: playerName,
            gamerTag: gamerTag,
            role: role,
            teamId: teamId,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
            .then(() => {
                alert("✅ Player added with role!");
            })
            .catch((error) => {
                alert("❌ Error: " + error.message);
                console.error(error);
            });
    }
</script>
<script>
    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
    }
</script>

<div id="banner-container"></div>

<script>
    fetch("banner.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("banner-container").innerHTML = data;
        });
</script>

<script>
    // Load footer HTML first
    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.body.insertAdjacentHTML("beforeend", data);

            // After footer loads, fetch live updates from Firestore
            db.collection("updates")
                .orderBy("timestamp", "desc")
                .limit(5)
                .onSnapshot(snapshot => {
                    const messages = snapshot.docs.map(doc => doc.data().message);
                    const marquee = document.getElementById("updates-marquee");
                    marquee.textContent = messages.join("  ⚔️  ");
                });
        });
</script>


</body>
</html>
