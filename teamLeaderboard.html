<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Fixtures</title>


  <base href="/Esports-fixtures/">


  <link rel="stylesheet" href="css/style.css">


  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>


  <script src="js/Test1.js"></script>
</head>

<body>
<div id="navbar-container"></div>

<script>
  // Load the navbar dynamically
  fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
          });
</script>

<h2>Team Leaderboard (By Wins)</h2>

<table border="1" cellpadding="10">
  <thead>
  <tr>
    <th>Rank</th>
    <th>Team Name</th>
    <th>Wins</th>
  </tr>
  </thead>
  <tbody id="leaderboardBody">
  <tr><td colspan="3">Loading...</td></tr>
  </tbody>
</table>

<script>
  const leaderboardBody = document.getElementById("leaderboardBody");

  // Step 1: Get all fixtures with results
  db.collection("fixtures").where("result", "!=", "").get()
          .then((querySnapshot) => {
            const winCounts = {};

            querySnapshot.forEach((doc) => {
              const data = doc.data();
              const winner = data.result;

              if (winner) {
                if (!winCounts[winner]) {
                  winCounts[winner] = 1;
                } else {
                  winCounts[winner]++;
                }
              }
            });

            // Step 2: Convert to array and sort
            const sortedTeams = Object.entries(winCounts)
                    .map(([team, wins]) => ({ team, wins }))
                    .sort((a, b) => b.wins - a.wins);

            // Step 3: Display leaderboard
            leaderboardBody.innerHTML = "";

            sortedTeams.forEach((entry, index) => {
              const row = document.createElement("tr");
              row.innerHTML = `
            <td>${index + 1}</td>
            <td>${entry.team}</td>
            <td>${entry.wins}</td>
          `;
              leaderboardBody.appendChild(row);
            });

            if (sortedTeams.length === 0) {
              leaderboardBody.innerHTML = "<tr><td colspan='3'>No results available yet.</td></tr>";
            }
          })
          .catch((error) => {
            console.error("Error loading leaderboard:", error);
            leaderboardBody.innerHTML = "<tr><td colspan='3'>Error loading leaderboard.</td></tr>";
          });
</script>
<script>
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
  }
</script>


<div id="banner-container"></div>

<script>
  fetch("banner.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("banner-container").innerHTML = data;
          });
</script>

</body>
</html>
