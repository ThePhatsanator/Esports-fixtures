<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>E-Sports Fixtures | KDA Leaderboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<script>
    fetch("navbar.html").then(r => r.text()).then(html => document.getElementById("navbar-container").innerHTML = html);
</script>

<div class="container" style="text-align:right; margin-top:10px;">
    <button id="themeToggle">🌙</button>
</div>

<main class="container">
    <h2>KDA Leaderboard</h2>

    <table>
        <thead>
        <tr>
            <th>Rank</th><th>Player Name</th><th>Team</th><th>Avg. KDA</th>
        </tr>
        </thead>
        <tbody id="leaderboardBody"><tr><td colspan="4">Loading...</td></tr></tbody>
    </table>
</main>

<div id="banner-container"></div>
<script>
    fetch("banner.html").then(r=>r.text()).then(html=>document.getElementById("banner-container").innerHTML = html);
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase-loader.js"></script>
<script src="js/theme-toggle.js"></script>

<!-- Fallback waiter -->
<script>
    if (!window.firebaseReady) {
        console.warn("⚠️ firebase-init.js not loaded yet — waiting...");
        window.firebaseReady = new Promise((resolve) => {
            const check = setInterval(() => {
                if (window.firebase && firebase.apps.length > 0 && firebase.auth) {
                    clearInterval(check);
                    window.db = window.db || firebase.firestore();
                    window.auth = window.auth || firebase.auth();
                    console.log("✅ Firebase fallback ready (KDA)");
                    resolve();
                }
            }, 100);
        });
    }
</script>

<!-- 🌟 Leaderboard Logic -->
<script>
    window.firebaseReady.then(async () => {
        const leaderboardBody = document.getElementById("leaderboardBody");
        const playerStats = {};

        try {
            const fixturesSnap = await db.collection("fixtures").get();
            if (fixturesSnap.empty) {
                leaderboardBody.innerHTML = "<tr><td colspan='4'>No fixtures found.</td></tr>";
                return;
            }

            // Loop through fixtures and gather all player stats
            for (const fixtureDoc of fixturesSnap.docs) {
                const statsSnap = await fixtureDoc.ref.collection("stats").get();
                statsSnap.forEach(doc => {
                    const s = doc.data();
                    if (!s.playerName) return;

                    const playerKey = s.playerName.trim().toLowerCase();
                    if (!playerStats[playerKey]) {
                        playerStats[playerKey] = {
                            name: s.playerName,
                            team: s.team || "N/A",
                            totalKills: 0,
                            totalDeaths: 0,
                            totalAssists: 0,
                            matches: 0
                        };
                    }

                    playerStats[playerKey].totalKills += Number(s.kills) || 0;
                    playerStats[playerKey].totalDeaths += Number(s.deaths) || 0;
                    playerStats[playerKey].totalAssists += Number(s.assists) || 0;
                    playerStats[playerKey].matches++;
                });
            }

            // Convert to array for sorting
            const leaderboard = Object.values(playerStats).map(p => {
                const avgKills = p.totalKills / p.matches;
                const avgDeaths = p.totalDeaths / p.matches || 1;
                const avgAssists = p.totalAssists / p.matches;
                const avgKDA = ((avgKills + avgAssists) / avgDeaths).toFixed(2);
                return { ...p, avgKDA: parseFloat(avgKDA) };
            });

            leaderboard.sort((a,b) => b.avgKDA - a.avgKDA);

            // Populate table
            leaderboardBody.innerHTML = "";
            if (leaderboard.length === 0) {
                leaderboardBody.innerHTML = "<tr><td colspan='4'>No player stats found.</td></tr>";
                return;
            }

            leaderboard.forEach((p, i) => {
                const row = document.createElement("tr");
                row.innerHTML = `
        <td>${i + 1}</td>
        <td>${p.name}</td>
        <td>${p.team}</td>
        <td>${p.avgKDA}</td>
      `;
                leaderboardBody.appendChild(row);
            });
        } catch (err) {
            console.error("Error loading leaderboard:", err);
            leaderboardBody.innerHTML = "<tr><td colspan='4'>Error loading data.</td></tr>";
        }
    });
</script>

<!-- Footer -->
<script>
    fetch("footer.html").then(r=>r.text()).then(html=>{
        document.body.insertAdjacentHTML("beforeend", html);
        window.firebaseReady.then(()=>{
            db.collection("updates").orderBy("timestamp","desc").limit(5).onSnapshot(snap=>{
                const msgs = snap.docs.map(d=>d.data().message);
                const marquee = document.getElementById("updates-marquee");
                if (marquee) marquee.textContent = msgs.join(" ⚔️ ");
            });
        });
    });
</script>
</body>
</html>
