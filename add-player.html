<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Fixtures | Page Title</title>

    <!-- 🔗 CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 🔥 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- ⚙️ Firebase Config + Theme Script -->
    <script src="js/Test1.js" defer></script>
    <script src="js/firebase-loader.js" defer></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/theme-toggle.js"></script>

</head>

<body>

<div id="navbar-container"></div>
<script>
    fetch("navbar.html")
        .then(res => res.text())
        .then(html => document.getElementById("navbar-container").innerHTML = html)
        .catch(err => console.error("Navbar load failed:", err));
</script>


<div class="container" style="text-align: right; margin-top: 10px;">
    <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>


<main class="container">
    <h2>Add Player</h2>

    <input type="text" id="playerName" placeholder="Full Name" /><br />
    <input type="text" id="gamerTag" placeholder="Gamer Tag" /><br />
    <input type="text" id="role" placeholder="Role (e.g. Captain, Sniper)" /><br />

    <label for="teamSelect">Select Team:</label>
    <select id="teamSelect">
        <option disabled selected>Loading teams...</option>
    </select><br />

    <button onclick="addPlayer()">Add Player</button>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Wait until Firebase is ready
            if (typeof db === "undefined") {
                console.error("❌ Firebase not initialized — check js/Test1.js");
                return;
            }

            console.log("✅ Firebase connected, loading teams...");


            db.collection("teams").get().then((querySnapshot) => {
                const teamSelect = document.getElementById("teamSelect");
                teamSelect.innerHTML = "";
                if (querySnapshot.empty) {
                    teamSelect.innerHTML = "<option disabled>No teams found</option>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    console.log("Team fetched:", data); // 👈 Debug log
                    const option = document.createElement("option");
                    option.value = doc.id;
                    option.text = data.teamName || data.name || "(Unnamed)";
                    teamSelect.appendChild(option);
                });
            }).catch(err => console.error("🔥 Firestore fetch error:", err));
        });

        function addPlayer() {
            const playerName = document.getElementById("playerName").value;
            const gamerTag = document.getElementById("gamerTag").value;
            const role = document.getElementById("role").value;
            const teamId = document.getElementById("teamSelect").value;

            db.collection("players").add({
                playerName: playerName,
                gamerTag: gamerTag,
                role: role,
                teamId: teamId,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
                .then(() => {
                    alert("✅ Player added with role!");
                })
                .catch((error) => {
                    alert("❌ Error: " + error.message);
                    console.error(error);
                });
        }
    </script>
</main>


<div id="banner-container"></div>
<script>
    fetch("banner.html")
        .then(res => res.text())
        .then(html => document.getElementById("banner-container").innerHTML = html)
        .catch(err => console.error("Banner load failed:", err));
</script>


<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);

            // Fetch latest updates for the news banner
            db.collection("updates")
                .orderBy("timestamp", "desc")
                .limit(5)
                .onSnapshot(snapshot => {
                    const messages = snapshot.docs.map(doc => doc.data().message);
                    const marquee = document.getElementById("updates-marquee");
                    if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                });
        })
        .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
