<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sports Fixtures | Page Title</title>

    <!-- 🔗 CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 🔥 Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- ⚙️ Firebase Config + Theme Script -->
    <script src="js/firebase-loader.js" defer></script>
    <script src="js/Test1.js" defer></script>
</head>

<body>
<!-- ===== NAVBAR ===== -->
<div id="navbar-container"></div>
<script>
    fetch("navbar.html")
        .then(res => res.text())
        .then(html => document.getElementById("navbar-container").innerHTML = html)
        .catch(err => console.error("Navbar load failed:", err));
</script>

<!-- ===== THEME TOGGLE BUTTON ===== -->
<div class="container" style="text-align: right; margin-top: 10px;">
    <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<!-- ===== MAIN CONTENT AREA ===== -->

<h2>Register a Team</h2>
<form id="teamForm">
    <label for="teamName">Team Name:</label><br>
    <input type="text" id="teamName" required><br><br>

    <label for="managerEmail">Manager Email:</label><br>
    <input type="email" id="managerEmail" required><br><br>

    <button onclick ="registerTeam()">Register Team</button>
</form>

<p id="statusMessage"></p>

<script>
    document.getElementById("teamForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const teamName = document.getElementById("teamName").value;
        const managerEmail = document.getElementById("managerEmail").value;

        db.collection("teams").add({
            teamName: teamName,
            managerEmail: managerEmail,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
            .then(() => {
                document.getElementById("statusMessage").innerText = "✅ Team registered successfully!";
                document.getElementById("teamForm").reset();
            })
            .catch((error) => {
                console.error("Error adding team: ", error);
                document.getElementById("statusMessage").innerText = "❌ Error: " + error.message;
            });
    });

    function registerTeam() {
        const teamName = document.getElementById("teamName").value;
        const managerEmail = document.getElementById("managerEmail").value;

        db.collection("teams").add({
            teamName: teamName,
            managerEmail: managerEmail,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
            .then(() => {
                alert("✅ Team registered successfully!");
            })
            .catch((error) => {
                alert("❌ Failed to register team: " + error.message);
                console.error(error);
            });
    }

</script>


<div id="banner-container"></div>
<script>
    fetch("banner.html")
        .then(res => res.text())
        .then(html => document.getElementById("banner-container").innerHTML = html)
        .catch(err => console.error("Banner load failed:", err));
</script>

<!-- ===== FOOTER + LIVE UPDATES ===== -->
<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);

            // Fetch latest updates for the news banner
            db.collection("updates")
                .orderBy("timestamp", "desc")
                .limit(5)
                .onSnapshot(snapshot => {
                    const messages = snapshot.docs.map(doc => doc.data().message);
                    const marquee = document.getElementById("updates-marquee");
                    if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                });
        })
        .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
