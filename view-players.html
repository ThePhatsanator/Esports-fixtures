<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Sports Fixtures | Page Title</title>

  <!-- 🔗 CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 🔥 Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- ⚙️ Firebase Config + Theme Script -->

  <script src="js/Test1.js" defer></script>
  <script src="js/firebase-loader.js" defer></script>





</head>

<body>
<!-- ===== NAVBAR ===== -->
<div id="navbar-container"></div>
<script>
  fetch("navbar.html")
          .then(res => res.text())
          .then(html => document.getElementById("navbar-container").innerHTML = html)
          .catch(err => console.error("Navbar load failed:", err));
</script>

<!-- ===== THEME TOGGLE BUTTON ===== -->
<div class="container" style="text-align: right; margin-top: 10px;">
  <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<!-- ===== MAIN CONTENT AREA ===== -->

<h2>View Players by Team</h2>

<label for="teamSelect">Select Team:</label>
<select id="teamSelect">
  <option disabled selected>Loading teams...</option>
</select>

<button onclick="loadPlayers()">Load Players</button>

<h3>Players:</h3>
<ul id="playerList"></ul>

<script>
  // Load teams into dropdown

    db.collection("teams").get().then((querySnapshot) => {
      const teamSelect = document.getElementById("teamSelect");
      teamSelect.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const option = document.createElement("option");
        option.value = doc.id;
        option.text = doc.data().teamName;
        teamSelect.appendChild(option);
      });
    });


  // Load players by selected team
  function loadPlayers() {
    const teamId = document.getElementById("teamSelect").value;
    const playerList = document.getElementById("playerList");
    playerList.innerHTML = "Loading...";


    db.collection("players")
            .where("teamId", "==", teamId)
            .get()
            .then((querySnapshot) => {
              playerList.innerHTML = "";
              if (querySnapshot.empty) {
                playerList.innerHTML = "<li>No players found.</li>";
              } else {
                querySnapshot.forEach((doc) => {
                  const player = doc.data();
                  const li = document.createElement("li");
                  li.textContent = `${player.playerName} (${player.gamerTag}) - Role: ${player.role || "N/A"}`;
                  playerList.appendChild(li);
                });
              }
            })
            .catch((error) => {
              console.error("Error loading players: ", error);
              playerList.innerHTML = "<li>Error loading players.</li>";
            });
  }

</script>

<!-- ===== BANNER ===== -->
<div id="banner-container"></div>
<script>
  fetch("banner.html")
          .then(res => res.text())
          .then(html => document.getElementById("banner-container").innerHTML = html)
          .catch(err => console.error("Banner load failed:", err));
</script>

<!-- ===== FOOTER + LIVE UPDATES ===== -->
<script>
  fetch("footer.html")
          .then(res => res.text())
          .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);

            // Fetch latest updates for the news banner
            window.firebaseReady.then(() => {
              db.collection("updates")
                      .orderBy("timestamp", "desc")
                      .limit(5)
                      .onSnapshot(snapshot => {
                        const messages = snapshot.docs.map(doc => doc.data().message);
                        const marquee = document.getElementById("updates-marquee");
                        if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                      });
            })

                    .catch(err => console.error("Footer load failed:", err));

          });
</script>
</body>
</html>
