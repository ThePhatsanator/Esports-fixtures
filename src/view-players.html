<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="css/style.css">


  <title>View Players by Team</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/Test1.js"></script>
</head>
<body>
<div id="navbar-container"></div>

<script>
  // Load the navbar dynamically
  fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
          });
</script>

<h2>View Players by Team</h2>

<label for="teamSelect">Select Team:</label>
<select id="teamSelect">
  <option disabled selected>Loading teams...</option>
</select>

<button onclick="loadPlayers()">Load Players</button>

<h3>Players:</h3>
<ul id="playerList"></ul>

<script>
  // Load teams into dropdown
  db.collection("teams").get().then((querySnapshot) => {
    const teamSelect = document.getElementById("teamSelect");
    teamSelect.innerHTML = "";
    querySnapshot.forEach((doc) => {
      const option = document.createElement("option");
      option.value = doc.id;
      option.text = doc.data().teamName;
      teamSelect.appendChild(option);
    });
  });

  // Load players by selected team
  function loadPlayers() {
    const teamId = document.getElementById("teamSelect").value;
    const playerList = document.getElementById("playerList");
    playerList.innerHTML = "Loading...";

    db.collection("players")
            .where("teamId", "==", teamId)
            .get()
            .then((querySnapshot) => {
              playerList.innerHTML = "";
              if (querySnapshot.empty) {
                playerList.innerHTML = "<li>No players found.</li>";
              } else {
                querySnapshot.forEach((doc) => {
                  const player = doc.data();
                  const li = document.createElement("li");
                  li.textContent = `${player.playerName} (${player.gamerTag}) - Role: ${player.role || "N/A"}`;
                  playerList.appendChild(li);
                });
              }
            })
            .catch((error) => {
              console.error("Error loading players: ", error);
              playerList.innerHTML = "<li>Error loading players.</li>";
            });
  }
</script>
<script>
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
  }
</script>

<div id="banner-container"></div>

<script>
  fetch("banner.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("banner-container").innerHTML = data;
          });
</script>

</body>
</html>
