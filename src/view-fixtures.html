<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">


  <title>View Fixtures</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="Test1.js"></script>
</head>
<body>
<div id="navbar-container"></div>

<script>
  // Load the navbar dynamically
  fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
          });
</script>

<h2>All Fixtures</h2>

<table border="1" cellpadding="10">
  <thead>
  <tr>
    <th>Team A</th>
    <th>Team B</th>
    <th>Date</th>
    <th>Result</th>
  </tr>
  </thead>
  <tbody id="fixtureTable">
  <tr><td colspan="4">Loading fixtures...</td></tr>
  </tbody>
</table>

<script>
  const table = document.getElementById("fixtureTable");

  db.collection("fixtures").orderBy("date").get()
          .then((querySnapshot) => {
            table.innerHTML = "";

            if (querySnapshot.empty) {
              table.innerHTML = "<tr><td colspan='4'>No fixtures available.</td></tr>";
            }

            querySnapshot.forEach((doc) => {
              const data = doc.data();
              const row = document.createElement("tr");

              const date = data.date ? new Date(data.date).toLocaleDateString() : "Not set";
              const result = data.result || "Pending";

              row.innerHTML = `
            <td>${data.teamA}</td>
            <td>${data.teamB}</td>
            <td>${date}</td>
            <td>${result}</td>
          `;
              table.appendChild(row);
            });
          })
          .catch((error) => {
            console.error("Error loading fixtures: ", error);
            table.innerHTML = "<tr><td colspan='4'>Error loading fixtures.</td></tr>";
          });
</script>
<script>
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
  }
</script>


<div id="banner-container"></div>

<script>
  fetch("banner.html")
          .then(response => response.text())
          .then(data => {
            document.getElementById("banner-container").innerHTML = data;
          });
</script>

</body>
</html>
