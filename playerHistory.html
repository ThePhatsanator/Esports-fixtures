<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>E-Sports Fixtures | Player History</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<script>fetch("navbar.html").then(r=>r.text()).then(h=>document.getElementById("navbar-container").innerHTML=h);</script>

<div class="container" style="text-align:right; margin-top:10px;">
  <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<main class="container">
  <h2>Player Match History</h2>

  <label for="playerSelect">Select Player:</label>
  <select id="playerSelect"><option disabled selected>Loading players...</option></select>
  <button id="loadHistoryBtn">Load History</button>

  <div id="historyDisplay" style="margin-top:20px"></div>
</main>

<div id="banner-container"></div>
<script>fetch("banner.html").then(r=>r.text()).then(html=>document.getElementById("banner-container").innerHTML=html);</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase-loader.js"></script>

<!-- fallback waiter -->
<script>
  if (!window.firebaseReady) {
    console.warn("⚠️ firebase-init.js not loaded yet — waiting for Firebase to initialize...");
    window.firebaseReady = new Promise((resolve) => {
      const checkInterval = setInterval(() => {
        if (window.firebase && firebase.apps && firebase.apps.length > 0 && firebase.auth) {
          clearInterval(checkInterval);
          window.db = window.db || firebase.firestore();
          window.auth = window.auth || firebase.auth();
          console.log("✅ Firebase fallback initialization complete (player-history)");
          resolve();
        }
      }, 100);
    });
  }
</script>

<script>
  window.firebaseReady.then(()=>{
    const playerSelect = document.getElementById("playerSelect");
    const historyDisplay = document.getElementById("historyDisplay");

    db.collection("players").get().then(snapshot=>{
      playerSelect.innerHTML = '<option disabled selected>Select a player</option>';
      if (snapshot.empty) {
        playerSelect.innerHTML = '<option disabled>No players</option>';
        return;
      }
      snapshot.forEach(doc=>{
        const d = doc.data();
        const opt = document.createElement("option");
        opt.value = doc.id;
        opt.textContent = `${d.playerName} (${d.gamerTag})`;
        playerSelect.appendChild(opt);
      });
    });

    document.getElementById("loadHistoryBtn").addEventListener("click", ()=>{
      const playerId = playerSelect.value;
      if (!playerId) return alert("Please select a player");
      historyDisplay.innerHTML = "<p>Loading match history...</p>";

      db.collection("matchStats").where("playerId","==",playerId).orderBy("createdAt","desc").get()
              .then(snapshot=>{
                if (snapshot.empty) {
                  historyDisplay.innerHTML = "<p>No match history found for this player.</p>";
                  return;
                }
                let table = `<table border="1" cellpadding="10"><thead><tr><th>Match Date</th><th>Fixture</th><th>Kills</th><th>Deaths</th><th>Assists</th><th>KDA</th></tr></thead><tbody>`;

                const promises = [];
                snapshot.forEach(doc=>{
                  const stat = doc.data();
                  const p = db.collection("fixtures").doc(stat.fixtureId).get().then(fdoc=>{
                    const fixture = fdoc.exists ? fdoc.data() : {};
                    const date = fixture.date || "N/A";
                    const fixtureLabel = (fixture.teamA && fixture.teamB) ? `${fixture.teamA} vs ${fixture.teamB}` : "Unknown Fixture";
                    table += `<tr><td>${date}</td><td>${fixtureLabel}</td><td>${stat.kills}</td><td>${stat.deaths}</td><td>${stat.assists}</td><td>${stat.kda}</td></tr>`;
                  });
                  promises.push(p);
                });

                Promise.all(promises).then(()=> {
                  table += "</tbody></table>";
                  historyDisplay.innerHTML = table;
                });
              })
              .catch(err => {
                console.error("Error loading match history:", err);
                historyDisplay.innerHTML = "<p>Error loading match history.</p>";
              });
    });
  });
</script>

<!-- footer -->
<script>
  fetch("footer.html").then(r=>r.text()).then(html=>{
    document.body.insertAdjacentHTML("beforeend", html);
    window.firebaseReady.then(()=> {
      db.collection("updates").orderBy("timestamp","desc").limit(5).onSnapshot(snap=>{
        const messages = snap.docs.map(d=>d.data().message);
        const marquee = document.getElementById("updates-marquee");
        if (marquee) marquee.textContent = messages.join(" ⚔️ ");
      });
    });
  });
</script>
</body>
</html>
