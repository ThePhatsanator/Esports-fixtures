<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>E-Sports Fixtures | KDA Leaderboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<script>
    fetch("navbar.html").then(r => r.text()).then(html => document.getElementById("navbar-container").innerHTML = html);
</script>

<div class="container" style="text-align:right; margin-top:10px;">
    <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<main class="container">
    <h2>KDA Leaderboard</h2>

    <table border="1" cellpadding="10">
        <thead>
        <tr>
            <th>Rank</th><th>Player Name</th><th>Gamer Tag</th><th>Role</th><th>Avg. KDA</th>
        </tr>
        </thead>
        <tbody id="leaderboardBody"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
</main>

<div id="banner-container"></div>
<script>fetch("banner.html").then(r=>r.text()).then(html=>document.getElementById("banner-container").innerHTML = html);</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase-loader.js"></script>

<script src="theme-toggle.js"></script>

<!-- fallback waiter -->
<script>
    if (!window.firebaseReady) {
        console.warn("⚠️ firebase-init.js not loaded yet — waiting for Firebase to initialize...");
        window.firebaseReady = new Promise((resolve) => {
            const checkInterval = setInterval(() => {
                if (window.firebase && firebase.apps && firebase.apps.length > 0 && firebase.auth) {
                    clearInterval(checkInterval);
                    window.db = window.db || firebase.firestore();
                    window.auth = window.auth || firebase.auth();
                    console.log("✅ Firebase fallback initialization complete (kda)");
                    resolve();
                }
            }, 100);
        });
    }
</script>

<script>
    window.firebaseReady.then(() => {
        const dbRef = db;
        const leaderboardBody = document.getElementById("leaderboardBody");
        const playerData = {};

        dbRef.collection("matchStats").get()
            .then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (!playerData[data.playerId]) playerData[data.playerId] = { totalKDA: 0, matches: 0 };
                    playerData[data.playerId].totalKDA += parseFloat(data.kda);
                    playerData[data.playerId].matches += 1;
                });
                return dbRef.collection("players").get();
            })
            .then((querySnapshot) => {
                const leaderboard = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const stats = playerData[doc.id];
                    if (stats) {
                        const avgKDA = (stats.totalKDA / stats.matches).toFixed(2);
                        leaderboard.push({
                            playerName: data.playerName,
                            gamerTag: data.gamerTag,
                            role: data.role,
                            avgKDA: parseFloat(avgKDA)
                        });
                    }
                });

                leaderboard.sort((a,b) => b.avgKDA - a.avgKDA);
                leaderboardBody.innerHTML = "";
                if (leaderboard.length === 0) {
                    leaderboardBody.innerHTML = "<tr><td colspan='5'>No player stats found.</td></tr>";
                } else {
                    leaderboard.forEach((player, i) => {
                        const row = document.createElement("tr");
                        row.innerHTML = `<td>${i+1}</td><td>${player.playerName}</td><td>${player.gamerTag}</td><td>${player.role}</td><td>${player.avgKDA}</td>`;
                        leaderboardBody.appendChild(row);
                    });
                }
            })
            .catch(error => {
                console.error("Error loading leaderboard:", error);
                leaderboardBody.innerHTML = "<tr><td colspan='5'>Error loading leaderboard.</td></tr>";
            });
    });
</script>

<!-- footer -->
<script>
    fetch("footer.html").then(r=>r.text()).then(html=>{
        document.body.insertAdjacentHTML("beforeend", html);
        window.firebaseReady.then(()=>{
            db.collection("updates").orderBy("timestamp","desc").limit(5).onSnapshot(snap=>{
                const messages = snap.docs.map(d=>d.data().message);
                const marquee = document.getElementById("updates-marquee");
                if (marquee) marquee.textContent = messages.join(" ⚔️ ");
            });
        });
    });
</script>
</body>
</html>
