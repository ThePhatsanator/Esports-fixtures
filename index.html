<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>E-Sports Fixtures | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-container"></div>
<script>
    fetch("navbar.html")
        .then(res => res.text())
        .then(html => document.getElementById("navbar-container").innerHTML = html)
        .catch(err => console.error("Navbar load failed:", err));
</script>

<div class="container" style="text-align:right; margin-top:10px;">
    <button id="theme-toggle">🌙 Toggle Dark/Light</button>
</div>

<main class="container">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <p>Don't have an account? <a href="registration.html">Register</a></p>
</main>

<p style="margin-top:10px; text-align:center;">
    <a href="#" id="forgotPasswordLink">Forgot Password?</a>
</p>

<!-- 🔹 Password Reset Modal -->
<div id="resetModal" class="modal">
    <div class="modal-content">
        <h3>Reset Password</h3>
        <p>Enter your email address to receive a reset link.</p>
        <input type="email" id="resetEmail" placeholder="Email address">
        <div class="modal-actions">
            <button id="sendResetBtn">Send Reset Link</button>
            <button id="closeResetBtn" class="cancel">Cancel</button>
        </div>
        <p id="resetMessage" class="message"></p>
    </div>
</div>


<div id="banner-container"></div>
<script>
    fetch("banner.html")
        .then(res => res.text())
        .then(html => document.getElementById("banner-container").innerHTML = html)
        .catch(err => console.error("Banner load failed:", err));
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="js/firebase-loader.js"></script>

<script src="js/theme-toggle.js"></script>

<!-- fallback waiter -->
<script>
    if (!window.firebaseReady) {
        console.warn("⚠️ firebase-init.js not loaded yet — waiting for Firebase to initialize...");
        window.firebaseReady = new Promise((resolve) => {
            const checkInterval = setInterval(() => {
                if (window.firebase && firebase.apps && firebase.apps.length > 0 && firebase.auth) {
                    clearInterval(checkInterval);
                    window.db = window.db || firebase.firestore();
                    window.auth = window.auth || firebase.auth();
                    console.log("✅ Firebase fallback initialization complete (index)");
                    resolve();
                }
            }, 100);
        });
    }
</script>

<script>
    window.firebaseReady.then(() => {
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            auth.signInWithEmailAndPassword(email, password)
                .then(() => window.location.href = "dashboard.html")
                .catch(error => alert(error.message));
        });
    });
</script>

<script>
    const resetModal = document.getElementById("resetModal");
    const resetEmail = document.getElementById("resetEmail");
    const resetMsg = document.getElementById("resetMessage");
    const forgotLink = document.getElementById("forgotPasswordLink");

    forgotLink.addEventListener("click", e => {
        e.preventDefault();
        resetModal.style.display = "flex";
    });

    document.getElementById("closeResetBtn").addEventListener("click", () => {
        resetModal.style.display = "none";
        resetMsg.textContent = "";
        resetEmail.value = "";
    });

    document.getElementById("sendResetBtn").addEventListener("click", () => {
        const email = resetEmail.value.trim();
        if (!email) {
            resetMsg.textContent = "⚠️ Please enter your email.";
            resetMsg.style.color = "orange";
            return;
        }

        firebase.auth().sendPasswordResetEmail(email)
            .then(() => {
                resetMsg.textContent = "✅ Reset email sent! Check your inbox.";
                resetMsg.style.color = "green";
            })
            .catch((error) => {
                resetMsg.textContent = "❌ " + error.message;
                resetMsg.style.color = "red";
            });
    });

    // Close modal when clicking outside of it
    window.addEventListener("click", (e) => {
        if (e.target === resetModal) {
            resetModal.style.display = "none";
            resetMsg.textContent = "";
        }
    });
</script>

<!-- footer -->
<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(html => {
            document.body.insertAdjacentHTML("beforeend", html);
            window.firebaseReady.then(() => {
                db.collection("updates").orderBy("timestamp", "desc").limit(5)
                    .onSnapshot(snapshot => {
                        const messages = snapshot.docs.map(d => d.data().message);
                        const marquee = document.getElementById("updates-marquee");
                        if (marquee) marquee.textContent = messages.join(" ⚔️ ");
                    });
            });
        })
        .catch(err => console.error("Footer load failed:", err));
</script>
</body>
</html>
